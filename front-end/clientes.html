<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes - SAEP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Clientes</h1>
    <nav>
      <a href="principal.html">Início</a>
      <a href="clientes.html">Clientes</a>
      <a href="veiculos.html">Veículos</a>
      <a href="agendamentos.html">Agendamentos</a>
      <button class="btn-danger" onclick="logout()">Sair</button>
    </nav>
  </header>

  <div class="card">
    <h3>Novo Cliente</h3>
    <input type="text" id="nome" placeholder="Nome Completo">
    <input type="text" id="cpf" placeholder="CPF">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="text" id="email" placeholder="Email">
    <button onclick="salvarCliente()">Cadastrar Cliente</button>
  </div>

  <div class="card">
    <h3>Lista de Clientes</h3>
    <input type="text" id="busca" placeholder="Buscar por Nome ou CPF..." onkeyup="carregarClientes()">
    <table>
      <thead>
        <tr><th>ID</th><th>Nome</th><th>CPF (Descriptografado)</th><th>Telefone</th><th>Ações</th></tr>
      </thead>
      <tbody id="lista-clientes"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function carregarClientes() {
      const busca = document.getElementById('busca').value;
      const url = busca ? `${API_URL}/clientes?busca=${busca}` : `${API_URL}/clientes`;
      const res = await fetch(url, { headers: getHeaders() });
      if (res.status === 401) return logout();

      const clientes = await res.json();
      const tbody = document.getElementById('lista-clientes');
      tbody.innerHTML = '';
      clientes.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.id}</td>
            <td>${c.nome}</td>
            <td>${c.cpf}</td>
            <td>${c.email || '-'}</td>
            <td>${c.telefone || '-'}</td>
            <td><button class="btn-danger" onclick="deletarCliente(${c.id})">Excluir</button></td>
          </tr>`;
      });
    }

    async function salvarCliente() {
      const nome = document.getElementById('nome').value;
      const cpf = document.getElementById('cpf').value;
      const telefone = document.getElementById('telefone').value;
      const email = document.getElementById('email').value;

      const res = await fetch(`${API_URL}/clientes`, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ nome, cpf, telefone })
      });

      if (res.ok) {
        document.getElementById('nome').value = '';
        document.getElementById('cpf').value = '';
        document.getElementById('telefone').value = '';
        document.getElementById('email').value = '';
        carregarClientes();
      }
    }

    async function deletarCliente(id) {
      if (!confirm('Deseja excluir este cliente?')) return;
      await fetch(`${API_URL}/clientes/${id}`, { method: 'DELETE', headers: getHeaders() });
      carregarClientes();
    }

    carregarClientes();
  </script>
</body>
</html>
