<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Veículos - SAEP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Veículos</h1>
    <nav>
      <a href="principal.html">Início</a>
      <a href="clientes.html">Clientes</a>
      <a href="veiculos.html">Veículos</a>
      <a href="agendamentos.html">Agendamentos</a>
      <button class="btn-danger" onclick="logout()">Sair</button>
    </nav>
  </header>

  <div class="card">
    <h3>Novo Veículo</h3>
    <input type="text" id="modelo" placeholder="Modelo do Veículo">
    <input type="text" id="placa" placeholder="Placa">
    <select id="cliente_id">
      <option value="">Selecione o Proprietário (Cliente)</option>
    </select>
    <button onclick="salvarVeiculo()">Cadastrar Veículo</button>
  </div>

  <div class="card">
    <h3>Lista de Veículos</h3>
    <table>
      <thead>
        <tr><th>ID</th><th>Modelo</th><th>Placa</th><th>ID Cliente</th><th>Ações</th></tr>
      </thead>
      <tbody id="lista-veiculos"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function carregarOpcoesClientes() {
      const res = await fetch(`${API_URL}/clientes`, { headers: getHeaders() });
      const clientes = await res.json();
      const select = document.getElementById('cliente_id');
      select.innerHTML = '<option value="">Selecione o Proprietário (Cliente)</option>';
      clientes.forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.nome} (CPF: ${c.cpf})</option>`;
      });
    }

    async function carregarVeiculos() {
      const res = await fetch(`${API_URL}/veiculos`, { headers: getHeaders() });
      const veiculos = await res.json();
      const tbody = document.getElementById('lista-veiculos');
      tbody.innerHTML = '';
      veiculos.forEach(v => {
        tbody.innerHTML += `
          <tr>
            <td>${v.id}</td>
            <td>${v.modelo}</td>
            <td>${v.placa}</td>
            <td>${v.cliente_id}</td>
            <td><button class="btn-danger" onclick="deletarVeiculo(${v.id})">Excluir</button></td>
          </tr>`;
      });
    }

    async function salvarVeiculo() {
      const modelo = document.getElementById('modelo').value;
      const placa = document.getElementById('placa').value;
      const cliente_id = document.getElementById('cliente_id').value;

      if (!cliente_id) return alert('Por favor, selecione um cliente!');

      const res = await fetch(`${API_URL}/veiculos`, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ modelo, placa, cliente_id })
      });

      if (res.ok) {
        document.getElementById('modelo').value = '';
        document.getElementById('placa').value = '';
        carregarVeiculos();
      }
    }

    async function deletarVeiculo(id) {
      if (!confirm('Deseja excluir este veículo?')) return;
      await fetch(`${API_URL}/veiculos/${id}`, { method: 'DELETE', headers: getHeaders() });
      carregarVeiculos();
    }

    carregarOpcoesClientes();
    carregarVeiculos();
  </script>
</body>
</html>
